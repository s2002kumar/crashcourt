# Preserve experiment evidence after the existing canonical benchmark finishes.
# This workflow does not run or retry experiments. Any absent, inconsistent, or sensitive
# archive member fails closed; an existing release is never overwritten.
name: evidence-release
on:
  workflow_run:
    workflows: [bench]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BENCH_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve audited artifact bytes and manifest
        run: python3 scripts/publish_evidence.py
