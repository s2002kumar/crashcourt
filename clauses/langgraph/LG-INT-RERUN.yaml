notes: >-
  The first quote is the exact text of the rule (Rules of interrupts); code formatting is dropped.
  It makes the W1 misuse variant (effect before interrupt()) EXPECTED to duplicate its effect on
  resume. The page says nothing about two resumes of the same interrupt, or resumes with
  different values; those cases (F07, F08) have no clause and are GAP.
