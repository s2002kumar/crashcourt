# N8-base: N8's schedule again as the mitigation study's baseline, a separate batch of the
# same job, under the pre-registration commit of the study, never pooled with the archived N8
# batch (N8-gh39061196254-1), which stands as it ran. No fence, the ordinary sink.
v: 1
name: N8-base
cell: N8-base
seed: N8-base-v1
workload: w1
target: {saver: postgres, driver: async, durability: sync}
landmarks: langgraph-v1
workers: [w1, w2]
ops:
  - {id: start-1, worker: w1, thread: t1, after: start, input: {order: order-17}}
  - {id: resume-1, worker: w1, thread: t1, after: start-1, resume: approve}
schedule:
  - on: {fp: put_writes.before, worker: w1, op: resume-1, occurrence: 3}
    do: {pause: A-writes}
    landmark: L-EXW
  - on: {fp: put.before, worker: w1, op: resume-1, occurrence: 2}
    do: {pause: A-put}
    landmark: L-EXC
  - on: {all_paused: [A-writes, A-put]}
    do: {redeliver: {op: resume-1, to: w2}}
  - on: {ended: resume-1}
    do: {release: [A-writes, A-put]}
