# K3's shape (langgraph#8796, a published replication), as a held barrier: w1 runs W5's turn-1
# and is held at L-T1 (occurrence 3 of turn-1's put, put.before: after respond). w2 takes turn-1
# over; once turn-1 has ended, w1 is released and its put lands too.
v: 1
name: t11-k3-shape
cell: t11-k3-shape
seed: t11-k3-shape-v1
workload: w5
target: {saver: postgres, driver: async, durability: sync}
landmarks: langgraph-v1
workers: [w1, w2]
ops:
  - id: turn-1
    worker: w1
    thread: t1
    after: start
    input: {messages: [{role: user, content: First request., id: human-1}]}
schedule:
  - on: {fp: put.before, worker: w1, op: turn-1, occurrence: 3}
    do: {pause: A}
    landmark: L-T1
  - on: {all_paused: [A]}
    do: {redeliver: {op: turn-1, to: w2}}
  - on: {ended: turn-1}
    do: {release: [A]}
