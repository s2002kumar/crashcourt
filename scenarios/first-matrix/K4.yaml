# K4: the replication of langgraph#8764, an instrument cell (never new evidence). W1 approve's
# start op alone: w1 is killed at L-IN, the first put of start-1, before it commits (put.before),
# so the run was accepted and nothing of it is durable. The checker records "accepted run with
# no durable record" and exercises no invariant. What it is predicted to show is
# research/preregistration.md's cell K4.
v: 1
name: K4
cell: K4
seed: K4-v1
workload: w1
target: {saver: postgres, driver: async, durability: sync}
landmarks: langgraph-v1
workers: [w1]
ops:
  - {id: start-1, worker: w1, thread: t1, after: start, input: {order: order-17}}
schedule:
  - on: {fp: put.before, worker: w1, op: start-1, occurrence: 1}
    do: {signal: SIGKILL}
    landmark: L-IN
