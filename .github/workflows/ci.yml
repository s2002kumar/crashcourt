# Static checks and unit tests, then a smoke run of `doctor` against the compose services.
# Every action is pinned to a full commit SHA (supply-chain rule); the release tag is in the comment.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  UV_VERSION: "0.12.1"  # the uv that wrote uv.lock; a newer uv could rewrite it and fail --locked
  # Test the commit that was pushed, not the merge commit GitHub creates for a pull request, so the
  # manifest's git_sha names a commit that exists.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run crashcourt clauses check  # control C6: the registry validates offline
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.HEAD_SHA }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group dev
      - run: docker compose up -d --wait
      - run: >-
          uv run crashcourt doctor --manifest manifest-ci.json
          --compare research/evidence/t-02/manifest-local.json
      - name: manifest names the tested commit, checked out clean
        run: jq -e --arg sha "$HEAD_SHA" '.git_sha == $sha and .git_dirty == false' manifest-ci.json
      - run: uv run pytest -m integration
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: manifest-ci
          path: manifest-ci.json
