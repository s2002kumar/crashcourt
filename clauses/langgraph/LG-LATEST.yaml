applies_to: [AsyncPostgresSaver, PostgresSaver, AsyncSqliteSaver, SqliteSaver]
notes: >-
  Written as guidance for authors of custom checkpointers, not as a guarantee about the official
  savers. The page calls checkpoint ids ULIDs, but langgraph-checkpoint 4.2.0 generates them with
  uuid6 (checkpoint/base/__init__.py:854); how the official savers order them is the T-03 source
  audit's question. The page does not say which checkpoint is "latest" when two writers create
  sibling checkpoints of one parent. Open question: as a describes clause, whether it can support
  a verdict on its own, which decides whether the lineage and head invariants can ever be
  violations (see Polarity in src/crashcourt/clauses/models.py).
