# C3-w5-sync: the placebo control on W5, an instrument cell: L-T1 armed with action none and
# a zero-latency toxic on the worker's proxy, T-11's C3 shape under the cell's own name and seed.
v: 1
name: C3-w5-sync
cell: C3-w5-sync
seed: C3-w5-sync-v1
workload: w5
target: {saver: postgres, driver: async, durability: sync}
landmarks: langgraph-v1
workers: [w1]
toxics:
  - {worker: w1, type: latency, stream: downstream, latency_ms: 0, jitter_ms: 0}
ops:
  - id: turn-1
    worker: w1
    thread: t1
    after: start
    input: {messages: [{role: user, content: First request., id: human-1}]}
  - id: turn-2
    worker: w1
    thread: t1
    after: turn-1
    input: {messages: [{role: user, content: Second request., id: human-2}]}
schedule:
  - on: {fp: put.before, worker: w1, op: turn-1, occurrence: 3}
    do: {none: true}
    landmark: L-T1
