id: LG-PW-CRASH
title: Per-task writes are described as already durable, so successful nodes need not re-run
polarity: describes
paraphrase: >-
  As each node in a super-step finishes, its outputs are written to checkpoint_writes, linked to the
  in-progress checkpoint; the docs describe these writes as already durable, so that when another
  node in the same super-step fails, the successful nodes need not be re-run on resume.
quotes:
  - >-
    As each node within a super-step finishes, its outputs are written to the checkpointer's
    checkpoint_writes table as task entries linked to the in-progress checkpoint. These per-task
    writes are what enable pending writes recovery: if another node in the same super-step fails,
    the successful nodes' writes are already durable and don't need to be re-run on resume.
source_url: https://docs.langchain.com/oss/python/langgraph/checkpointers#super-steps
snapshot_url: https://docs.langchain.com/oss/python/langgraph/checkpointers.md
retrieved: 2026-10-10
snapshot_sha256: "3881beeb186af756c6f5495c89effa821fd654957c63584341b91861e6677b6a"
version_scope:
  package: langgraph
  specifier: ">=1.2,<1.3"
applies_to: [AsyncPostgresSaver, PostgresSaver, AsyncSqliteSaver, SqliteSaver]
notes: >-
  Split from LG-PW, which it replaces with LG-PW-EXC. The sentence describes the mechanism and
  states it for a node failing in the super-step; it does not say what happens when the process
  crashes, so it describes and carries no verdict: a re-run after a crash, of a task whose writes
  had committed, is GAP, never a VIOLATION candidate, unless a guaranteeing clause is found. Under
  durability="exit", per-task writes reach the saver only when the run ends (langgraph 1.2.12,
  pregel/_loop.py:466). The page was refetched on 2026-10-10 and still hashes to the snapshot
  recorded on 2026-10-08.
