# Target environment for Crashcourt runs. Ports bind to 127.0.0.1 only, never to other hosts.
# Images are pinned by digest with `python scripts/pin_images.py`; `crashcourt doctor` refuses tags alone.
name: crashcourt
services:
  postgres:
    # Newest 18.x on 2026-09-27; 19 is still in beta (19beta4, 2026-09-24).
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_USER: crashcourt
      POSTGRES_PASSWORD: crashcourt
      POSTGRES_DB: crashcourt
    ports: ["127.0.0.1:55432:5432"]  # 55432 keeps clear of a locally installed Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashcourt -d crashcourt"]
      interval: 2s
      timeout: 3s
      retries: 30
  toxiproxy:
    # Newest release on 2026-09-27 (v2.12.0, published 2025-03-18).
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports:
      - "127.0.0.1:8474:8474"    # control API
      - "127.0.0.1:15432:15432"  # proxied Postgres; the harness creates the proxy (T-05)
