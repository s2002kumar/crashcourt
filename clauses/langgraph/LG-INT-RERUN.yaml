id: LG-INT-RERUN
title: The node that called interrupt() restarts from its beginning on resume
polarity: permits
paraphrase: >-
  When execution resumes after an interrupt, the runtime restarts the whole node that called
  interrupt() from its beginning, not from the interrupt call, so code before the interrupt runs
  again; side effects before interrupt() should (ideally) be idempotent.
quotes:
  - >-
    When execution resumes (after you provide the requested input), the runtime restarts the entire
    node from the beginning—it does not resume from the exact line where interrupt was called. This
    means any code that ran before the interrupt will execute again.
  - >-
    Because interrupts work by re-running the nodes they were called from, side effects called
    before interrupt should (ideally) be idempotent.
source_url: https://docs.langchain.com/oss/python/langgraph/interrupts#rules-of-interrupts
