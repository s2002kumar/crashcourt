# Tier 1 and a tier-2 smoke of `doctor` (spec section 20).
# TODO(T-01): pin every action to a full commit SHA before the first merge (supply-chain rule).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
  doctor:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: docker compose up -d --wait
      - run: uv run crashcourt doctor --manifest manifest-ci.json --compare research/evidence/t-01/manifest-local.json
      - run: uv run pytest -m integration
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-ci
          path: manifest-ci.json
