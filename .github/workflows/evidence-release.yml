# One-shot publication of immutable N8 formal and benchmark artifacts.
# The original workflow_run event did not fire after the benchmark was dispatched by
# GITHUB_TOKEN; this guarded push fallback reads the already completed runs instead.
# No experiments are dispatched, retried, reclassified or deleted.
name: evidence-release
on:
  workflow_run:
    workflows: [bench]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/evidence-release.yml
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_dispatch') ||
      (github.event_name == 'push' &&
       startsWith(github.event.head_commit.message, 'ci: publish CrashCourt evidence archive once'))
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BENCH_RUN: ${{ github.event_name == 'push' && '40278406294' || github.event.workflow_run.id }}
    steps:
      - name: Require green CI for the one-shot publication commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 300); do
            found="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&per_page=40" \
              --jq ".workflow_runs | map(select(.head_sha == \"$GITHUB_SHA\" and .event == \"push\")) | first | {status, conclusion}")"
            state="$(jq -r '.status // ""' <<<"$found")"
            if [[ "$state" == completed ]]; then
              result="$(jq -r '.conclusion // ""' <<<"$found")"
              [[ "$result" == success ]] || { echo "Main CI failed: $result. No release."; exit 1; }
              echo "Release commit CI passed"
              exit 0
            fi
            sleep 10
          done
          echo "Main CI not finished; no release"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve audited artifact bytes and manifest
        run: python3 scripts/publish_evidence.py
