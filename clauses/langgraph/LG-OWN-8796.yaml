id: LG-OWN-8796
title: Proposed write-ownership capability (langgraph#8796)
polarity: proposed
paraphrase: >-
  Proposed, not adopted: a checkpointer that advertises write ownership must observably refuse a
  write from a superseded owner. The write must not become durable, and the superseded owner must
  be able to learn it lost, either because the write raises or because an explicit ownership-check
  barrier raises. It judges only savers that advertise the capability.
quotes:
  - >-
    a checkpointer that advertises write ownership must observably refuse a write from a superseded
    owner.
  - Durability. A write from a superseded owner must not become durable.
  - >-
    Observability, by a stated deadline. The superseded owner must be able to learn it lost —
    either the write raises, or an explicit acheck_write_ownership() barrier raises. Returning
    normally with no barrier is a silent refusal and fails.
