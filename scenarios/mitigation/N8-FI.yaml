# N8-FI: N8's schedule under both mitigations: the fence rejects the stale run's writes and the
# sink applies one charge. The predicted residual: the selected head names attempt 2 while the
# applied charge is attempt 1.
v: 1
name: N8-FI
cell: N8-FI
seed: N8-FI-v1
workload: w1
target: {saver: postgres, driver: async, durability: sync}
landmarks: langgraph-v1
workers: [w1, w2]
variant: {fence: enforce, idempotent_effects: true}
ops:
  - {id: start-1, worker: w1, thread: t1, after: start, input: {order: order-17}}
  - {id: resume-1, worker: w1, thread: t1, after: start-1, resume: approve}
schedule:
  - on: {fp: put_writes.before, worker: w1, op: resume-1, occurrence: 3}
    do: {pause: A-writes}
    landmark: L-EXW
  - on: {fp: put.before, worker: w1, op: resume-1, occurrence: 2}
    do: {pause: A-put}
    landmark: L-EXC
  - on: {all_paused: [A-writes, A-put]}
    do: {redeliver: {op: resume-1, to: w2}}
  - on: {ended: resume-1}
    do: {release: [A-writes, A-put]}
