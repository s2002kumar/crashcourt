# C1-w5-sync: the negative control on W5 under sync durability, an instrument cell. One
# worker, two sequential turns, no fault and no arm: T-09's w5-sequential under the cell's own
# name and seed.
v: 1
name: C1-w5-sync
cell: C1-w5-sync
seed: C1-w5-sync-v1
workload: w5
target: {saver: postgres, driver: async, durability: sync}
workers: [w1]
ops:
  - id: turn-1
    worker: w1
    thread: t1
    after: start
    input: {messages: [{role: user, content: First request., id: human-1}]}
  - id: turn-2
    worker: w1
    thread: t1
    after: turn-1
    input: {messages: [{role: user, content: Second request., id: human-2}]}
