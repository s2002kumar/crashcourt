# K4's shape (langgraph#8764, a published replication): W1 approve's start op alone; w1 is killed
# at L-IN, the first put of start-1, before it commits. Nothing of the run is durable.
v: 1
name: k4-shape
cell: k4-shape
seed: k4-shape-v1
workload: w1
target: {saver: postgres, driver: async, durability: sync}
landmarks: langgraph-v1
workers: [w1]
ops:
  - {id: start-1, worker: w1, thread: t1, after: start, input: {order: order-17}}
schedule:
  - on: {fp: put.before, worker: w1, op: start-1, occurrence: 1}
    do: {signal: SIGKILL}
    landmark: L-IN
