id: LG-PW
title: Writes of nodes that completed in a failed super-step are stored and not re-run
polarity: guarantees
paraphrase: >-
  When a node fails mid-execution in a super-step, LangGraph stores the pending writes of the other
  nodes that completed successfully in that super-step, and resuming from that super-step does not
  re-run those nodes.
quotes:
  - >-
    Pending writes: When a graph node fails mid-execution at a given super-step, LangGraph stores
    pending checkpoint writes from any other nodes that completed successfully at that super-step.
    When you resume graph execution from that super-step you don't re-run the successful nodes.
  - >-
    As each node within a super-step finishes, its outputs are written to the checkpointer's
    checkpoint_writes table as task entries linked to the in-progress checkpoint. These per-task
    writes are what enable pending writes recovery: if another node in the same super-step fails,
    the successful nodes' writes are already durable and don't need to be re-run on resume.
source_url: https://docs.langchain.com/oss/python/langgraph/checkpointers#pending-writes
snapshot_url: https://docs.langchain.com/oss/python/langgraph/checkpointers.md
retrieved: 2026-09-27
snapshot_sha256: "4a73f776970a6e5294d9e4c6ab4956164a78e807a352abacf2a70b2e7fd212c4"
version_scope:
  package: langgraph
  specifier: ">=1.2,<1.3"
applies_to: [AsyncPostgresSaver, PostgresSaver, AsyncSqliteSaver, SqliteSaver]
notes: >-
  Open question for review: the docs frame this around a node failing (an exception) in a
  super-step. They do not say whether it also holds when the process crashes after a sibling's
  writes were stored. I2 and I9 apply it to crashes; the second quote ("already durable") supports
  that reading but does not state it. Until that is settled, a crash-time re-run of a sibling
  whose writes committed should be treated as a VIOLATION candidate only with that caveat attached.
