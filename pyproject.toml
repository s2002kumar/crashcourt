[project]
name = "crashcourt"
version = "0.0.1"
description = "An open-source conformance and reliability lab for durable agent execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# System under test and its drivers: exact pins (T-01). Each is the newest
# release on PyPI on 2026-09-27; see tasks/T-01.md for sources and the psycopg bump.
dependencies = [
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  # Harness libraries: lower bounds here, exact versions in uv.lock.
  "packaging>=26.3",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
]

[project.scripts]
crashcourt = "crashcourt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12.20260906",
    "langgraph-checkpoint-conformance==0.0.2",
]

[tool.uv]
# The interpreter is part of the manifest: use uv's own build of the version in .python-version on
# every machine, never whatever Python the host or the CI runner happens to have. Which build of
# 3.12.13 uv installs depends on the uv release, so uv itself is pinned too (CI uses the same).
python-preference = "only-managed"
required-version = "==0.12.1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crashcourt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real OS processes, Docker, or the compose services (postgres, toxiproxy)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
strict = ["src"]
