id: LG-DUR-SYNC
title: Sync durability writes each checkpoint before the next step starts
polarity: guarantees
paraphrase: >-
  With durability="sync", LangGraph persists changes synchronously before the next step starts,
  so every checkpoint is written before execution continues.
quotes:
  - >-
    "sync": LangGraph persists changes synchronously before the next step starts. This ensures
    that LangGraph writes every checkpoint before continuing execution, providing high durability
    at the cost of some performance overhead.
source_url: https://docs.langchain.com/oss/python/langgraph/checkpointers#durability-modes
snapshot_url: https://docs.langchain.com/oss/python/langgraph/checkpointers.md
retrieved: 2026-09-27
snapshot_sha256: "4a73f776970a6e5294d9e4c6ab4956164a78e807a352abacf2a70b2e7fd212c4"
version_scope:
  package: langgraph
  specifier: ">=1.2,<1.3"
applies_to: [AsyncPostgresSaver, PostgresSaver, AsyncSqliteSaver, SqliteSaver]
notes: >-
  Spec section 12 read this from the same page. The docs state when the write happens relative
  to the next step; they do not say what the runtime does when the write fails or when a commit's
  outcome is unknown (lost acknowledgment). I1 and I11 read "written" as "the saver's put
  returned successfully"; that reading is mine, not the docs'.
