# Release builds of the evidence explorer. A release reads results/ and nothing else, and the release
# guard (site/scripts/release-guard.ts) refuses, before and after the build, any fixture, any DEMO- id,
# and any batch whose manifest or scenario hash does not hold up. Every action is pinned to a full
# commit SHA (supply-chain rule); the release tag is in the comment.
name: site-release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "results/**"
      - "site/**"
      - "src/crashcourt/fixtures/**"
      - ".github/workflows/site-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    # The release build from the results/ in this commit. On a tag or a manual run it always builds, so
    # with no batch in results/ it fails closed. On a pull request it builds whenever results/ holds
    # anything, which is how a planted fixture fails a pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Look for results
        id: results
        run: |
          if [ -d results ] && [ -n "$(ls -A results)" ]; then present=yes; else present=no; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "results/ holds files: $present"
      - if: github.event_name == 'pull_request' && steps.results.outputs.present == 'no'
        run: echo "No results/ in this pull request, so there is nothing to release."
      - if: github.event_name != 'pull_request' || steps.results.outputs.present == 'yes'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: github.event_name != 'pull_request' || steps.results.outputs.present == 'yes'
        working-directory: site
        run: npm ci
      - if: github.event_name != 'pull_request' || steps.results.outputs.present == 'yes'
        working-directory: site
        run: npm run build:release
      - if: github.event_name != 'pull_request' || steps.results.outputs.present == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: site-release
          path: site/out/
          if-no-files-found: error

  guard-proof:
    # The guard on every case in site/tests/release/cases.ts, each through the real release build in
    # this job's own checkout: the clean self-test batch must build, and every planted case must stop
    # the build. Then the output half must refuse a build made from the demo fixtures.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Each case through the release build
        shell: bash
        run: |
          failed=0
          while read -r name expect; do
            rm -rf ../results
            node tests/release/cases.ts "$name" ../results
            if npm run build:release > "$RUNNER_TEMP/$name.log" 2>&1; then got=pass; else got=fail; fi
            grep -E "release guard|build:release" "$RUNNER_TEMP/$name.log" | head -n 8
            if [ "$got" = "$expect" ]; then
              echo "ok: $name: the guard must $expect, and it did"
            else
              echo "::error::$name: the guard must $expect, but the release build did $got"
              failed=1
            fi
          done < <(node tests/release/cases.ts --list)
          rm -rf ../results
          exit "$failed"
      - name: The output guard refuses a build from the demo fixtures
        shell: bash
        run: |
          npm run build
          if npm run release:guard -- output > "$RUNNER_TEMP/output.log" 2>&1; then
            echo "::error::the output guard passed a build made from the demo fixtures"
            exit 1
          fi
          head -n 4 "$RUNNER_TEMP/output.log"
