[project]
name = "crashcourt"
version = "0.0.1"
description = "An open-source conformance and reliability lab for durable agent execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# System under test and its drivers: exact pins (spec section 16, T-01).
# langgraph 1.2.12 verified on PyPI 2026-09-26. The others were observed in upstream issues
# (Aug-Sep 2026); T-01 re-verifies them when resolving uv.lock.
dependencies = [
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-postgres==3.1.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "psycopg[binary,pool]==3.3.4",
]

[project.scripts]
crashcourt = "crashcourt.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crashcourt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose services (postgres, toxiproxy)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
strict = ["src"]
