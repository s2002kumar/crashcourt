applies_to: [AsyncPostgresSaver, PostgresSaver, AsyncSqliteSaver, SqliteSaver]
notes: >-
  The first quote is the exact text of the rule (Rules of interrupts); code formatting is dropped.
  It makes a node that performs a side effect before calling interrupt() EXPECTED to repeat that
  effect on resume. Since 2026-09-30 the page documents one second resume: when a typed
  response_schema rejects a resume value, a corrected Command(resume=...) on the same thread may
  follow. It says nothing about a second resume after an accepted one, or about two resumes with
  different values racing; those cases have no clause and are GAP.
