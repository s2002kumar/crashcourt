# W1 misuse: the precheck effect sits before interrupt() in approval, and LangGraph re-runs an
# interrupted node from its beginning on resume, so precheck fires twice per run (attempts 1 and
# 2), whatever the decision. That duplicate is documented behavior, shown here every time.
v: 1
name: w1-misuse
cell: w1-misuse
seed: w1-misuse-v1
workload: w1-misuse
target: {saver: postgres, driver: async, durability: sync}
workers: [w1]
ops:
  - {id: start-1, worker: w1, thread: t1, after: start, input: {order: order-17}}
  - {id: resume-1, worker: w1, thread: t1, after: start-1, resume: approve}
